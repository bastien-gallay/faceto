[package]
name = "faceto"
version = "0.1.0"
edition = "2021"
description = "A typed file → a visual workshop board you think through with an LLM. Event storming first; more formats to come."
license = "MIT OR Apache-2.0"
repository = "https://github.com/bastien-gallay/faceto"
readme = "README.md"
keywords = ["event-storming", "diagram", "workshop", "svg", "modeling"]
categories = ["command-line-utilities", "visualization"]
# Pinned in lockstep with rust-toolchain.toml and the CI matrix.
rust-version = "1.95"

[[bin]]
name = "faceto"
path = "src/main.rs"

[profile.release]
opt-level = 2

# A std-only tool never needs `unsafe`, and should never reach for `panic!`/`todo!`
# in shipped paths. These are enforced in CI via `clippy -- -D warnings`.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
panic = "warn"
todo = "warn"
unimplemented = "warn"

# faceto is deliberately zero-dependency: pure std, offline, fast to install.
# The model is parsed by a small hand-written JSON module (src/json.rs) — the whole
# point of the tool is "a simple typed file", so we type it ourselves.
