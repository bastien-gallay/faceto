name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded PR runs so a fresh push doesn't queue behind its own stale
# jobs. Pushes to main are never cancelled: those runs gate the default branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: CI only reads the repo.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"

# Third-party actions are pinned to commit SHAs (version in the trailing
# comment). Bump the SHA and the comment together; never use a mutable tag.
jobs:
  # Which kinds of file changed, so each check runs only when it's relevant.
  # A docs-only change skips the Rust jobs; a Rust-only change skips
  # markdownlint; etc. Skipped required jobs report a "skipped" check, which
  # the branch ruleset counts as passing — so gating never leaves a PR stuck
  # waiting. This only works because the required jobs have STATIC names: a
  # skipped *matrix* job reports its literal `${{ matrix.os }}` name and would
  # never satisfy a required check, so macOS is its own job below, not a matrix.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      markdown: ${{ steps.filter.outputs.markdown }}
      workflows: ${{ steps.filter.outputs.workflows }}
      just: ${{ steps.filter.outputs.just }}
      js: ${{ steps.filter.outputs.js }}
      roadmap: ${{ steps.filter.outputs.roadmap }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              # template.html + the client modules are include_str!'d into the binary, so a change
              # to any of them rebuilds and can break tests — treat them as a Rust change.
              - 'src/template.html'
              - 'src/client/**'
            markdown:
              - '**/*.md'
              - '.markdownlint-cli2.jsonc'
            workflows:
              - '.github/workflows/**'
            just:
              - 'justfile'
            js:
              # The board client's pure helpers are checked in plain node (tests/js/), and the
              # tests lift those helpers out of the client modules — so either changing re-runs them.
              - 'tests/js/**'
              - 'src/client/**'
            roadmap:
              - 'ROADMAP.md'
              - 'scripts/sync_roadmap.py'

  fmt:
    name: rustfmt
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # `toolchain` is kept in lockstep with rust-toolchain.toml and
      # Cargo.toml's rust-version. Bump all three together.
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - run: cargo fmt --all --check

  # Required check `clippy (ubuntu-latest)`. Runs on every Rust change.
  clippy:
    name: clippy (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.95.0"   # keep in lockstep with rust-toolchain.toml
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - run: cargo clippy --all-targets -- -D warnings

  # macOS clippy is main-only (and manual dispatch): not a required check, just
  # extra coverage on the default branch. Skipped on PRs to keep them fast.
  clippy-macos:
    name: clippy (macos-latest)
    needs: changes
    if: needs.changes.outputs.rust == 'true' && github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.95.0"   # keep in lockstep with rust-toolchain.toml
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - run: cargo clippy --all-targets -- -D warnings

  # Required check `test (ubuntu-latest)`. Runs on every Rust change.
  test:
    name: test (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.95.0"   # keep in lockstep with rust-toolchain.toml
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - run: cargo test --all-targets

  # macOS tests are main-only: the std-only HTTP server and threading are
  # platform-sensitive, so macOS earns its keep on the default branch. Not a
  # required check; skipped on PRs to keep them fast.
  test-macos:
    name: test (macos-latest)
    needs: changes
    if: needs.changes.outputs.rust == 'true' && github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.95.0"   # keep in lockstep with rust-toolchain.toml
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - run: cargo test --all-targets

  zero-deps:
    name: zero dependencies
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # faceto's headline promise is "no *runtime* crates, ever": the shipped binary is
    # pure std. This is the firewall — the *normal* dependency tree (what links into the
    # binary; excludes dev/build edges) must contain exactly one package, faceto itself.
    # Dev-dependencies (test-only, e.g. proptest) are allowed: they never enter the binary
    # or the offline install. `cargo tree -e normal` draws that line — `Cargo.lock` alone
    # can't, since it lists dev-dependency packages too.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.95.0"   # keep in lockstep with rust-toolchain.toml
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - name: Assert the shipped binary stays zero-dependency
        shell: bash
        run: |
          deps=$(cargo tree -e normal --prefix none | awk 'NF{print $1}' | sort -u)
          if [ "$deps" != "faceto" ]; then
            echo "::error::faceto's runtime dependency tree must be std-only, but found:"
            echo "$deps"
            exit 1
          fi
          echo "Runtime dependency tree is faceto-only. Shipped binary stays zero-dependency."

  binary-size:
    name: binary size budget
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # The other half of the dependency policy: dev-dependencies are free, so the guard against
    # *runtime* bloat is the shipped binary's size, not a dep count. Anchor ~905K; a 2 MiB ceiling
    # leaves generous headroom while still catching a real regression (a runtime crate, a large
    # embedded asset). Bump the ceiling deliberately if a genuine growth lands.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.95.0"   # keep in lockstep with rust-toolchain.toml
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - name: Build release and check the size budget
        shell: bash
        run: |
          cargo build --release
          size=$(stat -c%s target/release/faceto)
          ceiling=$((2 * 1024 * 1024))
          printf 'faceto release binary: %d bytes (ceiling %d)\n' "$size" "$ceiling"
          if [ "$size" -gt "$ceiling" ]; then
            echo "::error::faceto binary $size B exceeds the $ceiling B budget — a runtime dep or large embedded asset likely crept in."
            exit 1
          fi
          echo "Release binary is within the size budget."

  # Required check `client-logic (node)`. The board client (src/template.html) has pure helpers
  # checked in plain node — see tests/js/. Runs when the template or those tests change. Node is
  # preinstalled on ubuntu-latest and the tests use only std node APIs (no npm, no dependency), so
  # the zero-dependency promise is untouched. Static name so a skip counts as a passing required
  # check, matching the Rust jobs above.
  test-js:
    name: client-logic (node)
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: node tests/js/board-logic.test.mjs

  markdown:
    name: markdownlint
    needs: changes
    if: needs.changes.outputs.markdown == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd # v23
        with:
          globs: '**/*.md'
          config: '.markdownlint-cli2.jsonc'

  # Single-source-of-truth gate: ROADMAP.md must stay reconciled with issues (see its
  # "Single source of truth" section). The board (user Project #2) needs `project` scope,
  # which GITHUB_TOKEN lacks, so the check degrades to what a repo-scoped token can enforce:
  # the offline structural rule (every Now/Next row carries a `Tracked #N`) plus the
  # orphan-issue check (every open issue is referenced by some row). Column sync
  # (board → Status/Horizon) stays a local `just sync-roadmap` step — no PAT in CI.
  roadmap-check:
    name: roadmap-check
    needs: changes
    if: needs.changes.outputs.roadmap == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Parser selftest (offline, no network)
        run: python3 scripts/sync_roadmap.py --selftest
      - name: Reconcile ROADMAP.md against issues (stdlib-only, no PAT)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_roadmap.py --check

  actionlint:
    name: actionlint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install actionlint
        # taiki-e/install-action does not ship actionlint and the crate has no
        # prebuilt binaries, so we use the upstream downloader — pinned to
        # actionlint's v1.7.7 commit and verified by sha256 before running, so
        # this is never an unverified `curl | bash`.
        id: install
        env:
          ACTIONLINT_SHA: 03d0035246f3e81f36aed592ffb4bebf33a03106 # v1.7.7
          DOWNLOADER_SHA256: 221d1d16c03e4e4fcd867de34104e8d479bdce20ccdfa553b9a5c0dc29bf6af2
        run: |
          curl -fsSL -o download-actionlint.bash \
            "https://raw.githubusercontent.com/rhysd/actionlint/${ACTIONLINT_SHA}/scripts/download-actionlint.bash"
          echo "${DOWNLOADER_SHA256}  download-actionlint.bash" | sha256sum --check --status
          bash download-actionlint.bash 1.7.7
          echo "path=$(pwd)/actionlint" >> "$GITHUB_OUTPUT"
      - name: Run actionlint
        run: ${{ steps.install.outputs.path }} -color

  justfile:
    name: justfile
    needs: changes
    if: needs.changes.outputs.just == 'true'
    runs-on: ubuntu-latest
    # The justfile is the local mirror of these gates (see docs/ci.md). It never
    # ships and CI never runs it, so this only guards against rot: `--fmt --check`
    # catches formatting drift and `--summary` fails on a parse error. `just` is a
    # dev tool, not a crate, so the zero-dependency promise is untouched.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.55.1"   # pin so a new formatter release can't surprise CI
      - name: Check formatting and parsing
        run: |
          just --fmt --check --unstable
          just --summary > /dev/null
