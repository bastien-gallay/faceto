<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  /* Nameplate: the one serif in the system, for the board title only — the engraved maker's
     mark on the optical bench (DESIGN.md §3). All system fonts; nothing is downloaded. */
  body { margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 13px;
         background: #fbfbfd; color: #222;
         --nameplate: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; }
  header { position: sticky; top: 0; z-index: 5; display: flex; gap: 12px; align-items: center;
           padding: 8px 16px; background: #fff; border-bottom: 1px solid #e6e6ee; }
  header b { font-family: var(--nameplate); font-size: 20px; font-weight: 700; letter-spacing: .2px; }
  header .spacer { flex: 1; }
  button { font: inherit; padding: 5px 11px; border: 1px solid #cfcfda; border-radius: 7px;
           background: #fff; cursor: pointer; }
  button:hover { background: #f2f2f7; }
  /* Packing control: how crowded time-slots unpack (rows / columns / grid). A connected
     segmented control — one standard affordance, the active mode carries the accent. */
  .seg { display: inline-flex; border: 1px solid #cfcfda; border-radius: 7px; overflow: hidden; }
  .seg button { border: none; border-radius: 0; border-left: 1px solid #e6e6ee; padding: 5px 10px;
                color: #557; background: #fff; }
  .seg button:first-child { border-left: none; }
  .seg button[aria-pressed="true"] { background: #1A6FAE; color: #fff; }
  .seg button[aria-pressed="true"]:hover { background: #1A6FAE; }
  #status { font-size: 11px; padding: 3px 9px; border-radius: 999px; background: #eef; color: #557; }
  #status.live { background: #e6f7ec; color: #1b7a3d; }
  #note { font-size: 11px; color: #1b7a3d; }
  #board { overflow: auto; padding: 12px; }
  .edge, .sticky { transition: opacity .15s ease-out; }
  .edge.hl { stroke: #2f3c45; opacity: 1 !important; stroke-width: 2.4; }
  .sticky:hover .card { stroke: #1a1a1a; stroke-width: 2; }
  /* Keyboard focus: a visible ring on the focused sticky (focus-visible so a mouse click doesn't
     leave one behind). The whole sticky is a button — Enter opens its comment, ← / → move it. */
  .sticky:focus { outline: none; }
  .sticky:focus-visible .card { stroke: #1A6FAE; stroke-width: 3; }
  .sticky.has-note .card { stroke: #1A6FAE; stroke-width: 2.5; }
  /* On box hover: spotlight its connectors + neighbours, recede the rest. */
  #board.dim .edge:not(.hl) { opacity: .07; }
  #board.dim .sticky:not(.adj) { opacity: .32; }
  .sticky.resolved { filter: grayscale(.85); opacity: .6; }  /* live resolve-comment feedback */
  /* Inline rename: an HTML input floated over the sticky's screen rect — the live pen writes
     directly on the box (DESIGN: the accent is used only where you are acting). Double-click or
     F2 a sticky to edit its label in place; Enter commits, Escape cancels. */
  #rename-edit { position: fixed; display: none; z-index: 20; box-sizing: border-box;
                 font: 600 13px -apple-system, Segoe UI, Roboto, sans-serif; text-align: center;
                 padding: 2px 6px; border: 2px solid #1A6FAE; border-radius: 6px;
                 background: #fff; color: #222; box-shadow: 0 4px 14px #1a6fae33; }
  #rename-edit:focus { outline: none; }
  /* Inline add: a ghost ink-blue + that fades in when you hover a sticky (its right edge) or a lane
     title (prepend). DESIGN: the accent marks where you act; calmest form — a bare glyph, no chrome
     at rest. Click opens the same inline editor as rename to type the new label. */
  /* Hover glyphs — bare ghost affordances that fade in at a sticky's edges (+ add, × remove, and a
     speech-bubble comment). Individually anchored at different edges, never a button row (DESIGN §6:
     no floating toolbar); each is one glyph in the live-pen accent, no chrome at rest. */
  #add-plus, #remove-x, #comment-c { position: fixed; display: none; z-index: 19; width: 22px; height: 22px;
              padding: 0; border: none; background: none; cursor: pointer; color: #1A6FAE;
              font: 600 20px -apple-system, Segoe UI, Roboto, sans-serif; line-height: 22px;
              text-align: center; opacity: 0; transition: opacity .15s ease-out; }
  #add-plus.show, #remove-x.show, #comment-c.show { display: block; opacity: 1; }
  #comment-c svg { width: 16px; height: 16px; vertical-align: middle; fill: currentColor; }
  #add-plus:focus-visible, #remove-x:focus-visible, #comment-c:focus-visible { outline: 2px solid #1A6FAE; outline-offset: 1px; border-radius: 3px; opacity: 1; display: block; }
  /* Region gestures (F-container Stage 6): the label tab is a focusable rename target — same
     focus-visible ring as a sticky, so keyboard and mouse discoverability stay in parity. The
     rail (an invisible per-column hit-strip, region.rs) only shows a cursor; its "+" reuses
     #add-plus, so no rail-specific style is needed beyond the pointer affordance. */
  .region-tab { cursor: pointer; }
  .region-tab:focus { outline: none; }
  .region-tab:focus-visible rect { stroke: #1A6FAE; stroke-width: 2; }
  .region-rail { cursor: pointer; }
  /* Resize drag guide: a thin ink-blue line that follows the cursor, snapped to the column the
     drop would land on (F-inline-edit's live-pen accent, applied to a region boundary instead of
     a label). No transition — a drag must track the cursor instantly. */
  #region-drag-guide { position: fixed; display: none; z-index: 18; width: 2px; background: #1A6FAE;
                        opacity: .8; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { .edge, .sticky, #add-plus, #remove-x, #comment-c { transition: none; } }
  /* Narrow widths: let the header wrap instead of clipping. Without this the packing control
     (Rows / Columns / Grid) and the Reload button slide off-screen and become unreachable. */
  @media (max-width: 680px) {
    header { flex-wrap: wrap; gap: 8px 10px; }
    header b { flex-basis: 100%; font-size: 17px; }
    header .spacer { display: none; }
    .seg button { padding: 5px 9px; }
  }
  dialog { border: none; border-radius: 12px; padding: 0; width: min(440px, 92vw);
           box-shadow: 0 18px 50px #0003; }
  dialog::backdrop { background: #0006; }
  .modal-h { padding: 14px 16px; border-bottom: 1px solid #eee; }
  .modal-h .id { font-size: 11px; font-weight: 700; color: #888; }
  .modal-h .label { font-size: 16px; font-weight: 600; margin-top: 2px; }
  .modal-h .detail { font-size: 11px; color: #5a5a5a; margin-top: 3px; }
  .modal-h .detail:empty { display: none; }
  .modal-b { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .modal-b select, .modal-b textarea { font: inherit; padding: 8px; border: 1px solid #cfcfda; border-radius: 8px; }
  .modal-b textarea { min-height: 90px; resize: vertical; }
  .modal-f { padding: 12px 16px; display: flex; gap: 8px; justify-content: flex-end; border-top: 1px solid #eee; }
  .rel { font-size: 11px; color: #666; display: flex; flex-wrap: wrap; gap: 5px; align-items: baseline; }
  .rel:empty { display: none; }
  .rel .chip { background: #eef1f4; border-radius: 6px; padding: 1px 7px; color: #334; }
  .rel .chip b { color: #1A6FAE; font-weight: 700; }
  .prior { font-size: 11px; color: #777; }
  .prior div { padding: 3px 0; border-top: 1px dashed #eee; }
</style>
</head>
<body>
<header>
  <b>__TITLE__</b>
  <span id="status">checking…</span>
  <span id="note"></span>
  <span class="spacer"></span>
  <span class="seg" id="pack" role="group" aria-label="how overlapping stickies unpack">
    <button data-pack="rows" aria-pressed="true" title="stack overlapping stickies into rows — taller board">Rows</button>
    <button data-pack="columns" aria-pressed="false" title="fan overlapping stickies into columns — wider board">Columns</button>
    <button data-pack="grid" aria-pressed="false" title="pack overlapping stickies into a grid — balanced">Grid</button>
  </span>
  <span id="count" class="prior"></span>
  <button id="plain" style="display:none" title="clear the diff overlay and show the current board">Plain</button>
  <button id="export">Export comments</button>
  <button id="refresh" title="re-pull comments and show what changed in the board since you last looked">Reload</button>
</header>
<div id="board" role="group" aria-label="event-storming board — each sticky is a button: single-click to focus, double-click or F2 to rename, drag or arrow keys to move, c or Enter to comment, Delete to remove">__SVG__</div>
<input id="rename-edit" aria-label="rename this element" autocomplete="off" spellcheck="false">
<button id="add-plus" class="hovglyph" type="button" aria-label="add an element here" title="add an element">+</button>
<button id="remove-x" class="hovglyph" type="button" aria-label="remove this element" title="remove this element">×</button>
<button id="comment-c" class="hovglyph" type="button" aria-label="comment on this element (or press c)" title="comment (c)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5c-3.9 0-7 2.24-7 5 0 1.58 1.02 2.99 2.6 3.9-.14.86-.57 1.8-1.3 2.55 1.35-.14 2.55-.66 3.46-1.38.7.18 1.46.28 2.24.28 3.9 0 7-2.24 7-5.35C15 3.74 11.9 1.5 8 1.5z"/></svg></button>
<div id="region-drag-guide" aria-hidden="true"></div>

<dialog id="modal">
  <form method="dialog">
    <div class="modal-h">
      <div class="id" id="m-id"></div>
      <div class="label" id="m-label"></div>
      <div class="detail" id="m-detail"></div>
    </div>
    <div class="modal-b">
      <div class="rel" id="m-rel"></div>
      <div class="prior" id="m-prior"></div>
      <!-- Prose actions only. Rename / drop / move are direct board gestures now (double-click / F2,
           the × glyph or Delete, drag or ← / →); resolve is gated to hotspots / open questions in
           openModal. -->
      <select id="m-kind">
        <option value="comment">comment</option>
        <option value="split">split — this is more than one element</option>
        <option value="question">open question</option>
        <option value="resolve">resolve a hotspot</option>
      </select>
      <textarea id="m-text" placeholder="short note — the next session reads this and adjusts the model"></textarea>
    </div>
    <div class="modal-f">
      <button value="cancel">Cancel</button>
      <button id="m-save" value="save" style="background:#1A6FAE;color:#fff;border-color:#1A6FAE">Save comment</button>
    </div>
  </form>
</dialog>

<script>
const LS_KEY = "facetoComments";
const CFG = __CONFIG__;   // { colW, stickyW, stickyH, pack } — geometry + default packing, from render.rs
// Structural ops change the board itself, not feedback on a box — kept out of the note badges,
// counts and prior-comment list (and never resynced offline; the log is the truth).
const STRUCTURAL_KINDS = new Set([
  "move", "add", "drop", "region-add", "region-resize", "region-rename", "region-remove",
]);
// Of those, add/drop/region-* have no client-side fallback: there is no id to mint, or nothing to
// remove/resize/rename locally without a server round-trip. `move` is the one exception — it
// still applies (see replayMoves), so it's the one structural kind excluded here. Derived from
// STRUCTURAL_KINDS (not hand-copied) so a future structural kind is safe-by-default: it starts
// "not applied offline" until someone deliberately teaches replayMoves to apply it too.
const NOT_APPLIED_OFFLINE = new Set([...STRUCTURAL_KINDS].filter((k) => k !== "move"));
let serverLive = false;
let comments = [];        // {elemId, kind, text, ts}  (kind:"move" carries col/prevCol/swap…)
let shownVersion = null;  // model hash the board currently displays — the diff baseline
let diffing = false;
let diffBase = null;      // baseline hash the current diff overlay is drawn against (if diffing)
// How crowded time-slots unpack: rows (taller) | columns (wider) | grid (balanced). The board the
// server first sent is CFG.pack; a saved preference wins. Every /board.svg request carries it.
let pack = localStorage.getItem("facetoPack") || CFG.pack || "rows";
const boardSrc = (extra = {}) =>
  "/board.svg?" + new URLSearchParams({ pack, ...extra }).toString();

const $ = (s) => document.querySelector(s);
const lsGet = () => { try { return JSON.parse(localStorage.getItem(LS_KEY) || "[]"); } catch { return []; } };
const lsSet = (a) => localStorage.setItem(LS_KEY, JSON.stringify(a));
const note = (msg) => { $("#note").textContent = msg || ""; };
const liveVersion = async () => {
  try { const v = await fetch("/model-version", { cache: "no-store" }); if (v.ok) return (await v.json()).version; } catch {}
  return null;
};

// ---- moving stickies left / right -----------------------------------------
// A move never touches edges' endpoints (identity is `id`); it only shifts a sticky along the
// shared column axis. Persistence is a kind:"move" comment in comments.jsonl — the model file is
// left untouched for now — and the client replays those comments so a move survives reloads.
let hoverId = null;                              // sticky under the cursor, target of ← / →
let baseCol = {}, baseCx = {}, cyOf = {}, kindOf = {}, colOf = {};
let colX = {};   // authored column -> its centre x, read from the rendered stickies. Columns/Grid
                 // packing give a column the width of its busiest cell, so the pitch is NOT uniform
                 // and CFG.colW would lie — we measure the real centres instead.

// Snapshot the server-rendered layout: each sticky's authored column, lane and centre, plus each
// column's real centre x (a crowded column's centre is the midpoint of its sub-columns' spread).
function readLayout() {
  baseCol = {}; baseCx = {}; cyOf = {}; kindOf = {}; colOf = {}; colX = {};
  const span = {};   // col -> [minCx, maxCx]
  document.querySelectorAll(".sticky").forEach((g) => {
    const col = +g.dataset.col, cx = +g.dataset.cx;
    baseCol[g.id] = col;
    baseCx[g.id] = cx;
    cyOf[g.id] = +g.dataset.cy;
    kindOf[g.id] = g.dataset.kind;
    colOf[g.id] = col;
    const s = (span[col] ||= [cx, cx]);
    s[0] = Math.min(s[0], cx); s[1] = Math.max(s[1], cx);
  });
  for (const c in span) colX[c] = (span[c][0] + span[c][1]) / 2;
}

// The centre x of an authored column. An empty column (a move into a gap) is interpolated from the
// nearest occupied one at the default pitch, so the sticky still lands somewhere sensible.
function colCenter(col) {
  if (colX[col] !== undefined) return colX[col];
  const known = Object.keys(colX).map(Number);
  if (!known.length) return col * CFG.colW;
  let near = known[0];
  for (const k of known) if (Math.abs(k - col) < Math.abs(near - col)) near = k;
  return colX[near] + (col - near) * CFG.colW;
}

// A moved sticky keeps its sub-column offset and shifts by the gap between real column centres —
// exact in Rows, correct under the variable widths of Columns/Grid.
const centerOf = (id) => [baseCx[id] + (colCenter(colOf[id]) - colCenter(baseCol[id])), cyOf[id]];

// Port of render.rs `edge_path`: a smooth connector anchored on the boxes' facing edges. `o1`/`o2`
// slide each anchor along its facing edge (Lever B fan-out) — Y for a left/right face, X for a
// top/bottom face — so siblings meeting one box on the same side spread out. o1=o2=0 is the classic
// centre-to-centre path.
function edgePath([x1, y1], [x2, y2], o1 = 0, o2 = 0) {
  const W = CFG.stickyW, H = CFG.stickyH, f = (n) => n.toFixed(1);
  if (Math.abs(x2 - x1) < W) {
    const s = y2 >= y1 ? 1 : -1, ax1 = x1 + o1, ax2 = x2 + o2,
      ay1 = y1 + s * H / 2, ay2 = y2 - s * H / 2, my = (ay1 + ay2) / 2;
    return `M${f(ax1)},${f(ay1)} C${f(ax1)},${f(my)} ${f(ax2)},${f(my)} ${f(ax2)},${f(ay2)}`;
  }
  const s = x2 >= x1 ? 1 : -1, ax1 = x1 + s * W / 2, ax2 = x2 - s * W / 2,
    ay1 = y1 + o1, ay2 = y2 + o2, mx = (ax1 + ax2) / 2;
  return `M${f(ax1)},${f(ay1)} C${f(mx)},${f(ay1)} ${f(mx)},${f(ay2)} ${f(ax2)},${f(ay2)}`;
}

// Port of render.rs Lever B fan-out: group each connector's two endpoints by (box, facing side),
// then fan a side's members apart, ordered by the far end's cross position. Returns the live edge
// list (skipping any whose endpoints aren't placed) and, per edge, the [srcOffset, dstOffset] the
// server applied — so the in-page move-nudge redraws connectors exactly as the authoritative render.
const FAN_SPREAD = 12;
function fanOffsets() {
  const edges = [...document.querySelectorAll(".edge")].filter(
    (p) => colOf[p.dataset.src] !== undefined && colOf[p.dataset.dst] !== undefined);
  const off = edges.map(() => [0, 0]);
  const groups = new Map();
  const push = (node, face, member) => {
    const k = node + ":" + face;
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(member);
  };
  edges.forEach((p, ei) => {
    const [sx, sy] = centerOf(p.dataset.src), [dx, dy] = centerOf(p.dataset.dst);
    if (Math.abs(dx - sx) >= CFG.stickyW) {
      push(p.dataset.src, dx > sx ? 0 : 1, [ei, true, dy]);
      push(p.dataset.dst, sx > dx ? 0 : 1, [ei, false, sy]);
    } else {
      push(p.dataset.src, dy > sy ? 2 : 3, [ei, true, dx]);
      push(p.dataset.dst, sy > dy ? 2 : 3, [ei, false, sx]);
    }
  });
  for (const [key, members] of groups) {
    const k = members.length;
    if (k < 2) continue;
    members.sort((a, b) => a[2] - b[2] || a[0] - b[0]);
    // Clamp the step so the extreme anchor stays on the box face (mirrors render.rs fan_offsets):
    // a horizontal face (0/1) fans in Y over stickyH, a vertical face (2/3) in X over stickyW.
    const face = +key.slice(key.lastIndexOf(":") + 1);
    const half = (face <= 1 ? CFG.stickyH : CFG.stickyW) / 2;
    const step = Math.min(FAN_SPREAD, 2 * half / (k - 1));
    members.forEach(([ei, isSrc], slot) => {
      off[ei][isSrc ? 0 : 1] = step * (slot - (k - 1) / 2);
    });
  }
  return { edges, off };
}

// Translate every sticky to its current column and redraw the connectors that touch it. The shift
// is measured against the real column centres read from the DOM (colCenter), so it is exact in Rows
// and correct under the variable column widths of Columns/Grid. This is the only feedback in legacy
// `model.json` mode, where a move never changes the model version and so triggers no authoritative
// server re-render (in log mode the re-render lands moments later and replaces this nudge).
function applyLayout() {
  document.querySelectorAll(".sticky").forEach((g) => {
    if (colOf[g.id] === undefined) return;
    const dx = colCenter(colOf[g.id]) - colCenter(baseCol[g.id]);
    g.setAttribute("transform", dx ? `translate(${dx.toFixed(1)},0)` : "");
  });
  const { edges, off } = fanOffsets();
  edges.forEach((p, ei) => {
    p.setAttribute("d", edgePath(centerOf(p.dataset.src), centerOf(p.dataset.dst), off[ei][0], off[ei][1]));
  });
}

// Rebuild positions from the authored layout + every move comment, in order. Idempotent: each
// move carries an *absolute* target col, so re-applying the same comment converges (no drift).
// In log mode this is a no-op — the server folds moves into the board via `ElementMoved` and
// `/comments` returns feedback only — so the loop iterates nothing; it still drives the legacy
// `comments.jsonl` mode, where the board SVG is the authored layout and moves ride on top.
function replayMoves() {
  for (const id in baseCol) colOf[id] = baseCol[id];
  for (const c of comments) {
    if (c.kind !== "move" || colOf[c.elemId] === undefined) continue;
    colOf[c.elemId] = c.col;
    if (c.swapId !== undefined && colOf[c.swapId] !== undefined) colOf[c.swapId] = c.swapCol;
  }
  applyLayout();
}

// Move a sticky to an absolute target column, swapping with any sticky already in that column in
// the same lane. Shared by the ←/→ nudge (doMove) and drag-to-move — the single move contract.
// A no-op if the target is the current column. `dir` (for the note/text) is derived from the
// shift, so a single-step nudge and a multi-column drag both read naturally.
function moveTo(id, target) {
  if (colOf[id] === undefined || target === colOf[id]) return;
  const from = colOf[id];
  // No fixed left edge: `col` is a global coordinate and the lane-title `+` (prepend) mints
  // negative cols, which the renderer draws on-board. Moving left grows the board left the same way.
  let swapId = null;
  for (const oid in colOf) {
    if (oid !== id && kindOf[oid] === kindOf[id] && colOf[oid] === target) { swapId = oid; break; }
  }
  colOf[id] = target;
  if (swapId) colOf[swapId] = from;
  applyLayout();
  const dir = target < from ? "left" : "right";
  const c = { elemId: id, kind: "move", col: target, prevCol: from,
              text: `moved ${dir} to col ${target}`, ts: new Date().toISOString(), status: "open" };
  if (swapId) { c.swapId = swapId; c.swapCol = from; c.swapPrevCol = target; }
  note(swapId ? `swapped with ${swapId}` : `moved ${dir}`);
  postComment(c);
}

// Nudge a sticky one column left/right — the keyboard/arrow fast path.
function doMove(id, dir) {
  if (colOf[id] === undefined) return;
  moveTo(id, colOf[id] + (dir === "left" ? -1 : 1));
}

// ---- drag a sticky along its lane -----------------------------------------
// The mouse counterpart to the ←/→ nudge: grab a box and drag it left/right to a new column, the
// same kind:"move" the arrows post (via moveTo). Horizontal only — `type` selects the lane and a
// move never changes it. Pointer Events + setPointerCapture (like the region-resize drag): once
// captured, every event including pointerup lands on the box even if the button releases off-window,
// so the drag can't leak (the fix the PR #11 review pinned for region resize). A press that never
// crosses DRAG_THRESHOLD is a plain click, which just focuses the box (single-click is benign).
const DRAG_THRESHOLD = 4;   // px of travel before a press becomes a drag rather than a click
let stickyDrag = null;      // { id, startX, fromCol, col, moved } while dragging, else null
// The column index whose centre is nearest an SVG-space x, searching the occupied span plus one
// past each end (colCenter interpolates the empty ones at the default pitch) — snap-to-grid.
function nearestCol(svgX) {
  const known = Object.keys(colX).map(Number);
  if (!known.length) return 0;
  let best = Math.min(...known) - 1, bestD = Infinity;
  for (let c = best; c <= Math.max(...known) + 1; c++) {
    const d = Math.abs(colCenter(c) - svgX);
    if (d < bestD) { bestD = d; best = c; }
  }
  return best;
}
function startStickyDrag(e) {
  if (e.button !== 0 || renaming || adding || regionDrag || stickyDrag) return;
  const g = e.currentTarget;
  if (colOf[g.id] === undefined) return;
  stickyDrag = { id: g.id, startX: e.clientX, fromCol: colOf[g.id], col: colOf[g.id], moved: false };
  // the pointer is captured now, so the hover glyphs' own mouseleave won't fire — hide them all
  document.querySelectorAll(".hovglyph.show").forEach((b) => b.classList.remove("show"));
  g.setPointerCapture(e.pointerId);
  g.addEventListener("pointermove", dragSticky);
  g.addEventListener("pointerup", endStickyDrag);
  g.addEventListener("pointercancel", endStickyDrag);
}
function dragSticky(e) {
  if (!stickyDrag) return;
  if (!stickyDrag.moved && Math.abs(e.clientX - stickyDrag.startX) < DRAG_THRESHOLD) return;
  stickyDrag.moved = true;
  const svgLeft = document.querySelector("#board svg").getBoundingClientRect().left;
  const target = nearestCol(e.clientX - svgLeft);
  if (target === stickyDrag.col) return;
  stickyDrag.col = target;
  colOf[stickyDrag.id] = target;   // live preview through the shared applyLayout (box + its edges)
  applyLayout();
}
function endStickyDrag(e) {
  const g = e.currentTarget;
  g.removeEventListener("pointermove", dragSticky);
  g.removeEventListener("pointerup", endStickyDrag);
  g.removeEventListener("pointercancel", endStickyDrag);
  const d = stickyDrag;
  stickyDrag = null;
  if (!d) return;
  colOf[d.id] = d.fromCol;   // undo the preview so moveTo re-derives the true origin (and swaps)
  if (d.moved && d.col !== d.fromCol) {
    moveTo(d.id, d.col);     // sets colOf=target + applyLayout (with swap) + posts — no snap-back
  } else {
    applyLayout();           // sub-threshold / no-op: snap the box back to where it started
  }
}

// ---- inline rename --------------------------------------------------------
// Edit a label where it sits: an input floats over the sticky's screen rect — the live pen
// writing directly on the box (DESIGN: the accent marks where you are acting). Double-click or
// F2 opens it; Enter commits a kind:"rename", Escape cancels. The same non-blank rule the server
// enforces (events::nonblank) is applied here, and an unchanged label is a no-op, so a slip never
// posts a dead event. `renaming` holds the open edit (and silences the board's move/remove keys).
// A region's label tab reuses the same editor and function (`region` true), keyed by `regionId`
// instead of `elemId` — a region isn't an element (F-container Stage 6). `regionDrag` also gates
// this: a resize drag captures the pointer, but the keyboard (F2) isn't captured, so a rename must
// not open mid-drag either (review: the two gestures had no mutual exclusion).
let renaming = null;   // { id, original, region? } while editing, else null
function startRename(g, region) {
  if (!g || renaming || adding || regionDrag || stickyDrag) return;
  const input = $("#rename-edit"), r = g.getBoundingClientRect();
  Object.assign(input.style,
    { left: `${r.left}px`, top: `${r.top}px`, width: `${r.width}px`, height: `${r.height}px`, display: "block" });
  input.value = (region ? g.dataset.label : g.dataset.hero) || "";
  renaming = region ? { id: g.dataset.region, original: input.value, region: true } : { id: g.id, original: input.value };
  input.focus();
  input.select();
}
function endRename(commit) {
  if (!renaming) return;
  const { id, original, region } = renaming, text = $("#rename-edit").value.trim();
  renaming = null;
  $("#rename-edit").style.display = "none";
  if (!commit) { note("rename cancelled"); if (!region) document.getElementById(id)?.focus(); return; }
  if (!text) { note("rename needs a label — left unchanged"); return; }   // mirrors the server guard
  if (text === original.trim()) { note("no change"); return; }
  const ts = new Date().toISOString();
  if (region) {
    note("region renamed");
    postComment({ regionId: id, kind: "region-rename", text, ts, status: "open" });
    return;
  }
  note("renamed");
  postComment({ elemId: id, kind: "rename", text, ts, status: "open" });
}

// ---- inline remove --------------------------------------------------------
// Delete / Backspace on the hovered or focused sticky drops it. Destructive, so confirm first;
// then persist kind:"drop" — in log mode the server folds ElementRemoved and the reload shows the
// box gone (offline it is stashed, not applied — see postComment).
function doRemove(id) {
  const g = document.getElementById(id);
  if (!g) return;
  if (!window.confirm(`Remove "${g.dataset.hero || id}" from the board?`)) return;
  note(`removed ${id}`);
  postComment({ elemId: id, kind: "drop", text: "removed inline", ts: new Date().toISOString(), status: "open" });
}

// A hover glyph that acts on a stashed target id: a fixed ghost button (the × remove) that fades in
// at a box corner and stays reachable while the cursor travels onto it — the + add glyph's grace
// behaviour, factored so each glyph is a line of wiring, not a copy of the timer plumbing. `hoverId`
// is cleared the moment the cursor leaves the box for the glyph, so the target is stashed on show.
function graceGlyph(btn, act) {
  let hideT = null;
  btn.at = (x, y, targetId) => {
    clearTimeout(hideT);
    btn._target = targetId;
    btn.style.left = `${x}px`;
    btn.style.top = `${y}px`;
    btn.classList.add("show");
  };
  btn.hideSoon = () => { hideT = setTimeout(() => btn.classList.remove("show"), 140); };
  btn.addEventListener("mouseenter", () => clearTimeout(hideT));
  btn.addEventListener("mouseleave", () => btn.hideSoon());
  btn.addEventListener("click", () => { const id = btn._target; btn.classList.remove("show"); if (id) act(id); });
  return btn;
}
const removeXBtn = graceGlyph($("#remove-x"), doRemove);
// Comment moved off the single click (which now just focuses) onto the c key + this glyph — so the
// modal is prose-only. Both open it via openModal (hoisted below).
const commentBtn = graceGlyph($("#comment-c"), (id) => openModal(document.getElementById(id)));

// ---- inline add (the + affordance) ----------------------------------------
// A ghost ink-blue + fades in on sticky hover (its right edge → add-after, same lane, col+1) and on
// lane-title hover (→ prepend; the server derives the left-edge col). Clicking it opens the *same*
// inline editor as rename to type the new label — Enter posts kind:"add", Escape cancels. The id is
// minted server-side and the non-blank guard is mirrored here, so a blank slip never posts.
// The region rail (F-container Stage 6) reuses the same + and editor for `region-add`
// (`region: true`, carrying the new region's `[fromCol, toCol]` instead of a lane/col).
let adding = null;       // { type, col?, prepend?, sx, sy } or { region: true, fromCol, toCol, sx, sy }
let plusHideT = null;
const plusBtn = $("#add-plus");
function showPlus(x, y, action) {
  clearTimeout(plusHideT);
  plusBtn._action = action;
  plusBtn.style.left = `${x}px`;
  plusBtn.style.top = `${y}px`;
  plusBtn.classList.add("show");
}
// A short grace on leave lets the cursor travel from the sticky/label onto the + without it
// vanishing; the + cancels the timer on its own mouseenter.
function hidePlusSoon() { plusHideT = setTimeout(() => plusBtn.classList.remove("show"), 140); }
plusBtn.addEventListener("mouseenter", () => clearTimeout(plusHideT));
plusBtn.addEventListener("mouseleave", hidePlusSoon);
plusBtn.addEventListener("click", () => { if (plusBtn._action) startAdd(plusBtn._action); });
function startAdd(action) {
  if (renaming || adding || regionDrag || stickyDrag) return;
  plusBtn.classList.remove("show");
  const input = $("#rename-edit");
  // The region-add box mirrors render.rs's own tab-sizing formula via CFG (Composable — render.rs
  // stays the single source of truth for this layout decision; see REGION_TAB_H etc. in render.rs).
  // The label isn't known yet (the user hasn't typed it), so width guesses a placeholder length —
  // same rough-preview spirit as the element box, which doesn't know the future label either.
  const w = action.region ? CFG.regionTabCharW * 10 + CFG.regionTabPad : CFG.stickyW;
  const h = action.region ? CFG.regionTabH : CFG.stickyH;
  Object.assign(input.style,
    { left: `${action.sx}px`, top: `${action.sy}px`, width: `${w}px`, height: `${h}px`, display: "block" });
  input.value = "";
  adding = action;
  input.focus();
}
function endAdd(commit) {
  if (!adding) return;
  const a = adding, text = $("#rename-edit").value.trim();
  adding = null;
  $("#rename-edit").style.display = "none";
  if (!commit) { note("add cancelled"); return; }
  if (!text) { note("add needs a label — nothing added"); return; }   // mirrors the server guard
  const ts = new Date().toISOString();
  if (a.region) {
    note("region added");
    postComment({ kind: "region-add", text, fromCol: a.fromCol, toCol: a.toCol, ts, status: "open" });
    return;
  }
  note("element added");
  const c = { kind: "add", type: a.type, text, ts, status: "open" };
  if (a.prepend) c.prepend = true; else c.col = a.col;
  postComment(c);
}
// Lane titles are always rendered (R), so the prepend + reaches even an empty board. Re-bound after
// every board swap, alongside the stickies.
function bindLaneAdders() {
  document.querySelectorAll(".lane-label").forEach((t) => {
    t.style.cursor = "pointer";
    t.onmouseenter = () => {
      const r = t.getBoundingClientRect();
      showPlus(r.right + 6, r.top + r.height / 2 - 11,
        { type: t.dataset.lane, prepend: true, sx: r.right + 14, sy: r.top - 6 });
    };
    t.onmouseleave = hidePlusSoon;
  });
}

// ---- region gestures (F-container Stage 6) --------------------------------
// Create: hovering a `region-rail` cell (render.rs — one invisible hit-rect per visible column,
// painted *under* any live region so a gap between/around regions is the only place it shows
// through) reveals the same + as an element add; clicking it opens the same inline editor,
// `endAdd` posting kind:"region-add" for a one-column-wide span at that col.
// Rename: clicking (or Enter/Space on) the label tab opens the same editor, keyed by regionId.
// Resize: dragging a `region-edge` hit-line (render.rs) picks a new boundary column, snapped to
// the exact rail-cell edges the server itself renders — no pixel-to-column guessing needed, the
// true bounds are read straight off the DOM (readRegionRail). `regionBounds` mirrors `baseCol` for
// stickies: a snapshot of each region's current `[from, to]`, refreshed on every board swap.
// regionBounds only tracks *live* regions (`.region:not(.removed)`) — a removed region's group
// still carries `data-region`/`data-from-col`/`data-to-col` (so a diff overlay can identify it),
// but nothing on the new side can resize/rename it, so its bounds have no business in a map every
// live gesture reads by regionId.
let regionBounds = {};      // regionId -> { from, to }
let railLeft = {}, railRight = {};   // col -> its rail cell's left/right x, in SVG user units
function readRegionRail() {
  railLeft = {}; railRight = {};
  document.querySelectorAll(".region-rail").forEach((r) => {
    const col = +r.dataset.col;
    railLeft[col] = +r.getAttribute("x");
    railRight[col] = railLeft[col] + +r.getAttribute("width");
  });
}
// The column whose rail cell contains SVG-space x, or the nearest end column if x falls outside
// every rail cell (dragged past the board's edge). The rail only covers the element-derived
// column range, but render.rs now clamps each region's own data-from-col/data-to-col into that
// same range (review: emitting the raw unclamped bound here let a drag target a column with no
// rail cell, silently discarding an off-screen region's true extent) — so every bound this
// function needs to resolve is always addressable.
function colAtSvgX(x) {
  const cols = Object.keys(railLeft).map(Number).sort((a, b) => a - b);
  if (!cols.length) return null;
  for (const c of cols) if (x >= railLeft[c] && x < railRight[c]) return c;
  return x < railLeft[cols[0]] ? cols[0] : cols[cols.length - 1];
}
const dragGuide = $("#region-drag-guide");
let regionDrag = null;   // { regionId, edge, otherCol, svgLeft, col? } while dragging, else null
// Pointer Events + setPointerCapture (not mousedown/mousemove/mouseup on document): once captured,
// every subsequent pointer event for this gesture — including its pointerup — is delivered to
// `line` regardless of where the cursor ends up, even outside the browser window. Review: a plain
// document-level mouseup misses entirely if the button is released off-window, leaking `regionDrag`
// and the drag guide forever (no cleanup path existed for that case).
function startRegionResize(e) {
  if (e.button !== 0 || renaming || adding || regionDrag || stickyDrag) return;
  e.preventDefault();
  const line = e.currentTarget;
  const bounds = regionBounds[line.dataset.region];
  if (!bounds) return;
  const otherCol = line.dataset.edge === "from" ? bounds.to : bounds.from;
  const svgLeft = document.querySelector("#board svg").getBoundingClientRect().left;
  regionDrag = { regionId: line.dataset.region, edge: line.dataset.edge, otherCol, svgLeft };
  const bandRect = line.getBoundingClientRect();   // the edge line already spans band_top..band_bot
  Object.assign(dragGuide.style, { top: `${bandRect.top}px`, height: `${bandRect.height}px`, display: "block" });
  line.setPointerCapture(e.pointerId);
  line.addEventListener("pointermove", dragRegionEdge);
  line.addEventListener("pointerup", endRegionResize);
  line.addEventListener("pointercancel", endRegionResize);
}
function dragRegionEdge(e) {
  if (!regionDrag) return;
  const col = colAtSvgX(e.clientX - regionDrag.svgLeft);
  if (col === null) return;
  // Clamp so the dragged edge can never cross the fixed other edge (mirrors events::valid_span —
  // the client never even offers an invalid target, rather than posting one the server rejects).
  regionDrag.col = regionDrag.edge === "from"
    ? Math.min(col, regionDrag.otherCol - 1)
    : Math.max(col, regionDrag.otherCol + 1);
  const x = regionDrag.edge === "from" ? railLeft[regionDrag.col] : railRight[regionDrag.col];
  dragGuide.style.left = `${regionDrag.svgLeft + x}px`;
}
function endRegionResize(e) {
  e.currentTarget.removeEventListener("pointermove", dragRegionEdge);
  e.currentTarget.removeEventListener("pointerup", endRegionResize);
  e.currentTarget.removeEventListener("pointercancel", endRegionResize);
  dragGuide.style.display = "none";
  const d = regionDrag;
  regionDrag = null;
  if (!d || d.col === undefined) return;   // pointerdown with no drag (or a cancel) — nothing to commit
  const fromCol = d.edge === "from" ? d.col : d.otherCol;
  const toCol = d.edge === "from" ? d.otherCol : d.col;
  const bounds = regionBounds[d.regionId];
  if (bounds && bounds.from === fromCol && bounds.to === toCol) { note("no change"); return; }
  note("region resized");
  postComment({ regionId: d.regionId, kind: "region-resize", fromCol, toCol, ts: new Date().toISOString(), status: "open" });
}
// Re-bound after every board swap, alongside the stickies and lane adders.
function bindRegions() {
  readRegionRail();
  regionBounds = {};
  document.querySelectorAll(".region:not(.removed)").forEach((g) => {
    regionBounds[g.dataset.region] = { from: +g.dataset.fromCol, to: +g.dataset.toCol };
  });
  document.querySelectorAll(".region-rail").forEach((r) => {
    r.onmouseenter = () => {
      const rect = r.getBoundingClientRect();
      showPlus(rect.left + rect.width / 2 - 11, rect.top + 4,
        { region: true, fromCol: +r.dataset.col, toCol: +r.dataset.col + 1, sx: rect.left + 2, sy: rect.top + 2 });
    };
    r.onmouseleave = hidePlusSoon;
  });
  document.querySelectorAll(".region-tab").forEach((g) => {
    g.onclick = () => startRename(g, true);
    g.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); startRename(g, true); } };
  });
  document.querySelectorAll(".region-edge").forEach((edge) => {
    edge.onpointerdown = startRegionResize;
  });
}

// Persist a comment (move or feedback): POST when live, else stash in localStorage. Offline
// stash is best-effort and one-way — it is NOT replayed to the server on reconnect (the next
// live `load()` replaces `comments` with the server's), so structural ops made offline (`add`,
// `move`) never reach the log. Export keeps them; the user is told so below.
async function postComment(c) {
  let posted = false;
  try {
    const r = await fetch("/comment", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(c) });
    posted = r.ok;
  } catch {}
  if (posted) { await load(); return; }
  const a = lsGet(); a.push(c); lsSet(a); comments = a; replayMoves(); paint();
  // add/drop/region-* can't reach the board offline (no server to mint/remove/resize/rename);
  // move is the one structural kind applied locally (see replayMoves).
  note(NOT_APPLIED_OFFLINE.has(c.kind)
    ? `offline — ${c.kind} saved locally (not applied to the board; Export to keep it)`
    : "offline — saved locally (Export to keep)");
}

// Reload: re-pull comments, and when the model changed under us, redraw the board with the
// changes-since-you-last-looked overlay (diffed against the version currently on screen).
async function load() {
  serverLive = false;
  try {
    const r = await fetch("/comments", { cache: "no-store" });
    if (r.ok) { comments = await r.json(); serverLive = true; }
  } catch {}
  if (!serverLive) { comments = lsGet(); replayMoves(); paint(); return; }
  const live = await liveVersion();
  if (live && shownVersion && live !== shownVersion) await showDiff(shownVersion, live);
  else if (shownVersion === null) shownVersion = live;  // baseline the initial server-rendered board
  replayMoves();
  paint();
}

// Replace the board with one diffed against `base`; advance the baseline to `live`.
async function showDiff(base, live) {
  try {
    const r = await fetch(boardSrc({ base }), { cache: "no-store" });
    if (!r.ok) return;
    $("#board").innerHTML = await r.text();
    bindStickies();
    if (r.headers.get("X-Diff-Base")) {
      diffing = true;
      diffBase = base;
      $("#plain").style.display = "";
      note("showing what changed since you last looked — Plain to clear");
    } else {
      note("model changed (baseline gone) — showing current");
    }
    shownVersion = live;
  } catch {}
}

// Clear the diff overlay: redraw the plain current board and re-baseline to it.
async function showPlain() {
  try {
    const r = await fetch(boardSrc(), { cache: "no-store" });
    if (r.ok) { $("#board").innerHTML = await r.text(); bindStickies(); replayMoves(); }
  } catch {}
  diffing = false;
  diffBase = null;
  $("#plain").style.display = "none";
  note("");
  shownVersion = await liveVersion();
}

let adj = {};          // id -> Set(neighbour id), built from the rendered edges
let edgesByNode = {};  // id -> [<path class="edge">], for hover highlighting
function buildGraph() {
  adj = {}; edgesByNode = {};
  document.querySelectorAll(".edge").forEach((p) => {
    const s = p.dataset.src, d = p.dataset.dst;
    (edgesByNode[s] ||= []).push(p); (edgesByNode[d] ||= []).push(p);
    (adj[s] ||= new Set()).add(d); (adj[d] ||= new Set()).add(s);
  });
}
function hoverOn(id) {
  $("#board").classList.add("dim");
  (edgesByNode[id] || []).forEach((p) => p.classList.add("hl"));
  document.getElementById(id)?.classList.add("adj");
  (adj[id] || []).forEach((n) => document.getElementById(n)?.classList.add("adj"));
}
function hoverOff() {
  $("#board").classList.remove("dim");
  document.querySelectorAll(".edge.hl").forEach((p) => p.classList.remove("hl"));
  document.querySelectorAll(".sticky.adj").forEach((g) => g.classList.remove("adj"));
}
function bindStickies() {
  buildGraph();
  readLayout();
  document.querySelectorAll(".sticky").forEach((g) => {
    // Single click just focuses / spotlights (select-then-edit — the calm gesture); double-click or
    // F2 renames in place. Comment moved off the click onto the c key + the comment glyph, so the
    // box's click is benign — no modal, no disambiguation timer. Grab-drag along the lane moves it.
    g.ondblclick = () => startRename(g);
    g.onpointerdown = startStickyDrag;
    g.onmouseenter = () => {
      hoverId = g.id; hoverOn(g.id);
      const r = g.getBoundingClientRect();
      showPlus(r.right + 4, r.top + r.height / 2 - 11,
        { type: g.dataset.kind, col: +g.dataset.col + 1, sx: r.right + 12, sy: r.top });
      removeXBtn.at(r.right - 3, r.top - 9, g.id);                    // × at the top-right corner
      commentBtn.at(r.left - 24, r.top + r.height / 2 - 11, g.id);    // comment at the left edge
    };
    g.onmouseleave = () => {
      if (hoverId === g.id) hoverId = null;
      hoverOff(); hidePlusSoon(); removeXBtn.hideSoon(); commentBtn.hideSoon();
    };
    // Keyboard parity with the mouse: focusing a sticky makes it the ← / → move target (same as
    // hover) and spotlights its connectors; Enter / Space opens its comment dialog.
    g.onfocus = () => { hoverId = g.id; hoverOn(g.id); };
    g.onblur = () => { if (hoverId === g.id) { hoverId = null; hoverOff(); } };
    g.onkeydown = (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openModal(g); }
    };
  });
  bindLaneAdders();
  bindRegions();
}

function paint() {
  $("#status").textContent = serverLive ? "● live (server)" : "○ offline (localStorage)";
  $("#status").className = serverLive ? "live" : "";
  document.querySelectorAll(".sticky").forEach((g) => g.classList.remove("has-note"));
  // Structural ops (move/add/drop) aren't feedback on an existing box — keep them out of the note
  // badges, counts and prior-comment list. (Offline, a stashed `add`/`drop` lives only in
  // localStorage until export; there is no element to ring — or it's gone — see postComment.)
  const feedback = comments.filter((c) => !STRUCTURAL_KINDS.has(c.kind));
  const byEl = {};
  for (const c of feedback) if (c.elemId) (byEl[c.elemId] ||= []).push(c);
  for (const id in byEl) document.getElementById(id)?.classList.add("has-note");
  // A resolve comment quiets its hotspot right away (model `resolved:true` does it durably).
  for (const c of feedback) if (c.kind === "resolve") document.getElementById(c.elemId)?.classList.add("resolved");
  const open = feedback.filter((c) => c.status !== "resolved").length;
  $("#count").textContent = feedback.length ? `${feedback.length} comment(s), ${open} open` : "";
  window._byEl = byEl;
}

const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
function openModal(g) {
  const id = g.id;
  $("#m-id").textContent = id;
  $("#m-label").textContent = g.dataset.hero || "";
  $("#m-detail").textContent = g.dataset.detail || "";
  // Relationships, the keyboard/non-hover way to read a box's connectors.
  const rel = [...(adj[id] || [])].map((n) => {
    const h = document.getElementById(n)?.dataset.hero || n;
    return `<span class="chip"><b>${esc(n)}</b> ${esc(h)}</span>`;
  }).join("");
  $("#m-rel").innerHTML = rel ? "connected to: " + rel : "";
  $("#m-text").value = "";
  $("#m-kind").value = "comment";
  // Resolve only makes sense on a hotspot or an element carrying an open question — hide it elsewhere
  // (the reset to "comment" above means a hidden option is never the live selection).
  const hasQuestion = (window._byEl?.[id] || []).some((c) => c.kind === "question");
  const resolveOpt = $("#m-kind option[value='resolve']");
  resolveOpt.hidden = resolveOpt.disabled = !(g.dataset.kind === "hotspot" || hasQuestion);
  const prior = (window._byEl?.[id] || []).map((c) => `<div>[${esc(c.kind)}] ${esc(c.text)}</div>`).join("");
  $("#m-prior").innerHTML = prior ? "<b>prior:</b>" + prior : "";
  $("#modal").returnValue = "cancel";
  $("#modal").showModal();
  window._activeId = id;
}

syncPackUI();
bindStickies();
// The server first rendered CFG.pack; if a saved preference differs, switch to it before loading.
if (pack !== CFG.pack) renderPack();

$("#modal").addEventListener("close", () => {
  if ($("#modal").returnValue !== "save") return;
  const text = $("#m-text").value.trim();
  if (!text) return;
  const ts = new Date().toISOString();
  postComment({ elemId: window._activeId, kind: $("#m-kind").value, text, ts, status: "open" });
});

// Hover or focus a sticky and act on it from the keyboard — the keyboard-fast path, parity with
// the mouse: ← / → nudge a column, F2 renames in place, c opens its comment, Delete / Backspace
// removes. Skipped while the modal or an inline rename owns the keyboard, or while typing in a field.
// One inline editor, two modes: `adding` posts kind:"add", otherwise it commits a rename.
$("#rename-edit").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); adding ? endAdd(true) : endRename(true); }
  else if (e.key === "Escape") { e.preventDefault(); adding ? endAdd(false) : endRename(false); }
  e.stopPropagation();   // keep edit keystrokes from reaching the board-level handler below
});
$("#rename-edit").addEventListener("blur", () => { adding ? endAdd(true) : endRename(true); });
document.addEventListener("keydown", (e) => {
  // regionDrag / stickyDrag: a drag captures the pointer but not the keyboard, so F2 or c could
  // otherwise fire mid-drag (review: no gesture guarded against the other's in-progress state).
  if ($("#modal").open || renaming || adding || regionDrag || stickyDrag || !hoverId) return;
  const ae = document.activeElement;
  if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    e.preventDefault();
    doMove(hoverId, e.key === "ArrowLeft" ? "left" : "right");
  } else if (e.key === "F2") {
    e.preventDefault();
    startRename(document.getElementById(hoverId));
  } else if (e.key === "c" || e.key === "C") {
    e.preventDefault();
    openModal(document.getElementById(hoverId));
  } else if (e.key === "Delete" || e.key === "Backspace") {
    e.preventDefault();
    doRemove(hoverId);
  }
});

// ---- packing control (rows / columns / grid) ------------------------------
function syncPackUI() {
  document.querySelectorAll("#pack button").forEach((b) =>
    b.setAttribute("aria-pressed", b.dataset.pack === pack ? "true" : "false"));
}
// Re-render at the current packing, keeping the diff overlay if one is showing (same baseline).
async function renderPack() {
  try {
    const r = await fetch(boardSrc(diffing && diffBase ? { base: diffBase } : {}), { cache: "no-store" });
    if (!r.ok) return;
    $("#board").innerHTML = await r.text();
    bindStickies();
    if (!diffing) replayMoves();
    paint();
  } catch {}
}
$("#pack").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-pack]");
  if (!b || b.dataset.pack === pack) return;
  pack = b.dataset.pack;
  localStorage.setItem("facetoPack", pack);
  syncPackUI();
  renderPack();
});

$("#refresh").addEventListener("click", load);
$("#plain").addEventListener("click", showPlain);
$("#export").addEventListener("click", async () => {
  const data = JSON.stringify(comments, null, 2);
  try { await navigator.clipboard.writeText(data); } catch {}
  const blob = new Blob([data], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "faceto-comments.json";
  a.click();
});

load();
</script>
</body>
</html>
