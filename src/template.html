<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  /* Nameplate: the one serif in the system, for the board title only — the engraved maker's
     mark on the optical bench (DESIGN.md §3). All system fonts; nothing is downloaded. */
  body { margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 13px;
         background: #fbfbfd; color: #222;
         --nameplate: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; }
  header { position: sticky; top: 0; z-index: 5; display: flex; gap: 12px; align-items: center;
           padding: 8px 16px; background: #fff; border-bottom: 1px solid #e6e6ee; }
  header b { font-family: var(--nameplate); font-size: 20px; font-weight: 700; letter-spacing: .2px; }
  header .spacer { flex: 1; }
  button { font: inherit; padding: 5px 11px; border: 1px solid #cfcfda; border-radius: 7px;
           background: #fff; cursor: pointer; }
  button:hover { background: #f2f2f7; }
  /* Packing control: how crowded time-slots unpack (rows / columns / grid). A connected
     segmented control — one standard affordance, the active mode carries the accent. */
  .seg { display: inline-flex; border: 1px solid #cfcfda; border-radius: 7px; overflow: hidden; }
  .seg button { border: none; border-radius: 0; border-left: 1px solid #e6e6ee; padding: 5px 10px;
                color: #557; background: #fff; }
  .seg button:first-child { border-left: none; }
  .seg button[aria-pressed="true"] { background: #1A6FAE; color: #fff; }
  .seg button[aria-pressed="true"]:hover { background: #1A6FAE; }
  #status { font-size: 11px; padding: 3px 9px; border-radius: 999px; background: #eef; color: #557; }
  #status.live { background: #e6f7ec; color: #1b7a3d; }
  #note { font-size: 11px; color: #1b7a3d; }
  #board { overflow: auto; padding: 12px; }
  .edge, .sticky { transition: opacity .15s ease-out; }
  .edge.hl { stroke: #2f3c45; opacity: 1 !important; stroke-width: 2.4; }
  .sticky:hover .card { stroke: #1a1a1a; stroke-width: 2; }
  /* Keyboard focus: a visible ring on the focused sticky (focus-visible so a mouse click doesn't
     leave one behind). The whole sticky is a button — Enter opens its comment, ← / → move it. */
  .sticky:focus { outline: none; }
  .sticky:focus-visible .card { stroke: #1A6FAE; stroke-width: 3; }
  .sticky.has-note .card { stroke: #1A6FAE; stroke-width: 2.5; }
  /* On box hover: spotlight its connectors + neighbours, recede the rest. */
  #board.dim .edge:not(.hl) { opacity: .07; }
  #board.dim .sticky:not(.adj) { opacity: .32; }
  .sticky.resolved { filter: grayscale(.85); opacity: .6; }  /* live resolve-comment feedback */
  @media (prefers-reduced-motion: reduce) { .edge, .sticky { transition: none; } }
  /* Narrow widths: let the header wrap instead of clipping. Without this the packing control
     (Rows / Columns / Grid) and the Reload button slide off-screen and become unreachable. */
  @media (max-width: 680px) {
    header { flex-wrap: wrap; gap: 8px 10px; }
    header b { flex-basis: 100%; font-size: 17px; }
    header .spacer { display: none; }
    .seg button { padding: 5px 9px; }
  }
  dialog { border: none; border-radius: 12px; padding: 0; width: min(440px, 92vw);
           box-shadow: 0 18px 50px #0003; }
  dialog::backdrop { background: #0006; }
  .modal-h { padding: 14px 16px; border-bottom: 1px solid #eee; }
  .modal-h .id { font-size: 11px; font-weight: 700; color: #888; }
  .modal-h .label { font-size: 16px; font-weight: 600; margin-top: 2px; }
  .modal-h .detail { font-size: 11px; color: #5a5a5a; margin-top: 3px; }
  .modal-h .detail:empty { display: none; }
  .modal-b { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .modal-b select, .modal-b textarea { font: inherit; padding: 8px; border: 1px solid #cfcfda; border-radius: 8px; }
  .modal-b textarea { min-height: 90px; resize: vertical; }
  .modal-f { padding: 12px 16px; display: flex; gap: 8px; justify-content: flex-end; border-top: 1px solid #eee; }
  .rel { font-size: 11px; color: #666; display: flex; flex-wrap: wrap; gap: 5px; align-items: baseline; }
  .rel:empty { display: none; }
  .rel .chip { background: #eef1f4; border-radius: 6px; padding: 1px 7px; color: #334; }
  .rel .chip b { color: #1A6FAE; font-weight: 700; }
  .prior { font-size: 11px; color: #777; }
  .prior div { padding: 3px 0; border-top: 1px dashed #eee; }
</style>
</head>
<body>
<header>
  <b>__TITLE__</b>
  <span id="status">checking…</span>
  <span id="note"></span>
  <span class="spacer"></span>
  <span class="seg" id="pack" role="group" aria-label="how overlapping stickies unpack">
    <button data-pack="rows" aria-pressed="true" title="stack overlapping stickies into rows — taller board">Rows</button>
    <button data-pack="columns" aria-pressed="false" title="fan overlapping stickies into columns — wider board">Columns</button>
    <button data-pack="grid" aria-pressed="false" title="pack overlapping stickies into a grid — balanced">Grid</button>
  </span>
  <span id="count" class="prior"></span>
  <button id="plain" style="display:none" title="clear the diff overlay and show the current board">Plain</button>
  <button id="export">Export comments</button>
  <button id="refresh" title="re-pull comments and show what changed in the board since you last looked">Reload</button>
</header>
<div id="board" role="group" aria-label="event-storming board — each sticky is a button: Enter to comment, arrow keys to move it">__SVG__</div>

<dialog id="modal">
  <form method="dialog">
    <div class="modal-h">
      <div class="id" id="m-id"></div>
      <div class="label" id="m-label"></div>
      <div class="detail" id="m-detail"></div>
    </div>
    <div class="modal-b">
      <div class="rel" id="m-rel"></div>
      <div class="prior" id="m-prior"></div>
      <select id="m-kind">
        <option value="comment">comment</option>
        <option value="add">add — a new element, just after this one</option>
        <option value="split">split — this is more than one element</option>
        <option value="rename">rename / reword</option>
        <option value="drop">drop — never happened</option>
        <option value="move">move — wrong lane / position</option>
        <option value="question">open question</option>
        <option value="resolve">resolve a hotspot</option>
      </select>
      <select id="m-type" style="display:none" title="which lane the new element belongs to">
        <option value="event">event</option>
        <option value="command">command</option>
        <option value="aggregate">aggregate</option>
        <option value="policy">policy</option>
        <option value="readmodel">read model</option>
        <option value="actor">actor</option>
        <option value="external">external system</option>
        <option value="hotspot">hotspot</option>
      </select>
      <textarea id="m-text" placeholder="short note — the next session reads this and adjusts the model"></textarea>
    </div>
    <div class="modal-f">
      <button type="button" id="m-left" title="move this sticky one column left (or press ← while hovering it)">Move ←</button>
      <button type="button" id="m-right" title="move this sticky one column right (or press → while hovering it)">Move →</button>
      <span class="spacer" style="flex:1"></span>
      <button value="cancel">Cancel</button>
      <button id="m-save" value="save" style="background:#1A6FAE;color:#fff;border-color:#1A6FAE">Save comment</button>
    </div>
  </form>
</dialog>

<script>
const LS_KEY = "facetoComments";
const CFG = __CONFIG__;   // { colW, stickyW, stickyH, pack } — geometry + default packing, from render.rs
// Structural ops change the board itself, not feedback on a box — kept out of the note badges,
// counts and prior-comment list (and never resynced offline; the log is the truth).
const STRUCTURAL_KINDS = new Set(["move", "add", "drop"]);
let serverLive = false;
let comments = [];        // {elemId, kind, text, ts}  (kind:"move" carries col/prevCol/swap…)
let shownVersion = null;  // model hash the board currently displays — the diff baseline
let diffing = false;
let diffBase = null;      // baseline hash the current diff overlay is drawn against (if diffing)
// How crowded time-slots unpack: rows (taller) | columns (wider) | grid (balanced). The board the
// server first sent is CFG.pack; a saved preference wins. Every /board.svg request carries it.
let pack = localStorage.getItem("facetoPack") || CFG.pack || "rows";
const boardSrc = (extra = {}) =>
  "/board.svg?" + new URLSearchParams({ pack, ...extra }).toString();

const $ = (s) => document.querySelector(s);
const lsGet = () => { try { return JSON.parse(localStorage.getItem(LS_KEY) || "[]"); } catch { return []; } };
const lsSet = (a) => localStorage.setItem(LS_KEY, JSON.stringify(a));
const note = (msg) => { $("#note").textContent = msg || ""; };
const liveVersion = async () => {
  try { const v = await fetch("/model-version", { cache: "no-store" }); if (v.ok) return (await v.json()).version; } catch {}
  return null;
};

// ---- moving stickies left / right -----------------------------------------
// A move never touches edges' endpoints (identity is `id`); it only shifts a sticky along the
// shared column axis. Persistence is a kind:"move" comment in comments.jsonl — the model file is
// left untouched for now — and the client replays those comments so a move survives reloads.
let hoverId = null;                              // sticky under the cursor, target of ← / →
let baseCol = {}, baseCx = {}, cyOf = {}, kindOf = {}, colOf = {};
let colX = {};   // authored column -> its centre x, read from the rendered stickies. Columns/Grid
                 // packing give a column the width of its busiest cell, so the pitch is NOT uniform
                 // and CFG.colW would lie — we measure the real centres instead.

// Snapshot the server-rendered layout: each sticky's authored column, lane and centre, plus each
// column's real centre x (a crowded column's centre is the midpoint of its sub-columns' spread).
function readLayout() {
  baseCol = {}; baseCx = {}; cyOf = {}; kindOf = {}; colOf = {}; colX = {};
  const span = {};   // col -> [minCx, maxCx]
  document.querySelectorAll(".sticky").forEach((g) => {
    const col = +g.dataset.col, cx = +g.dataset.cx;
    baseCol[g.id] = col;
    baseCx[g.id] = cx;
    cyOf[g.id] = +g.dataset.cy;
    kindOf[g.id] = g.dataset.kind;
    colOf[g.id] = col;
    const s = (span[col] ||= [cx, cx]);
    s[0] = Math.min(s[0], cx); s[1] = Math.max(s[1], cx);
  });
  for (const c in span) colX[c] = (span[c][0] + span[c][1]) / 2;
}

// The centre x of an authored column. An empty column (a move into a gap) is interpolated from the
// nearest occupied one at the default pitch, so the sticky still lands somewhere sensible.
function colCenter(col) {
  if (colX[col] !== undefined) return colX[col];
  const known = Object.keys(colX).map(Number);
  if (!known.length) return col * CFG.colW;
  let near = known[0];
  for (const k of known) if (Math.abs(k - col) < Math.abs(near - col)) near = k;
  return colX[near] + (col - near) * CFG.colW;
}

// A moved sticky keeps its sub-column offset and shifts by the gap between real column centres —
// exact in Rows, correct under the variable widths of Columns/Grid.
const centerOf = (id) => [baseCx[id] + (colCenter(colOf[id]) - colCenter(baseCol[id])), cyOf[id]];

// Port of render.rs `edge_path`: a smooth connector anchored on the boxes' facing edges.
function edgePath([x1, y1], [x2, y2]) {
  const W = CFG.stickyW, H = CFG.stickyH, f = (n) => n.toFixed(1);
  if (Math.abs(x2 - x1) < W) {
    const s = y2 >= y1 ? 1 : -1, ay1 = y1 + s * H / 2, ay2 = y2 - s * H / 2, my = (ay1 + ay2) / 2;
    return `M${f(x1)},${f(ay1)} C${f(x1)},${f(my)} ${f(x2)},${f(my)} ${f(x2)},${f(ay2)}`;
  }
  const s = x2 >= x1 ? 1 : -1, ax1 = x1 + s * W / 2, ax2 = x2 - s * W / 2, mx = (ax1 + ax2) / 2;
  return `M${f(ax1)},${f(y1)} C${f(mx)},${f(y1)} ${f(mx)},${f(y2)} ${f(ax2)},${f(y2)}`;
}

// Translate every sticky to its current column and redraw the connectors that touch it. The shift
// is measured against the real column centres read from the DOM (colCenter), so it is exact in Rows
// and correct under the variable column widths of Columns/Grid. This is the only feedback in legacy
// `model.json` mode, where a move never changes the model version and so triggers no authoritative
// server re-render (in log mode the re-render lands moments later and replaces this nudge).
function applyLayout() {
  document.querySelectorAll(".sticky").forEach((g) => {
    if (colOf[g.id] === undefined) return;
    const dx = colCenter(colOf[g.id]) - colCenter(baseCol[g.id]);
    g.setAttribute("transform", dx ? `translate(${dx.toFixed(1)},0)` : "");
  });
  document.querySelectorAll(".edge").forEach((p) => {
    const s = p.dataset.src, d = p.dataset.dst;
    if (colOf[s] === undefined || colOf[d] === undefined) return;
    p.setAttribute("d", edgePath(centerOf(s), centerOf(d)));
  });
}

// Rebuild positions from the authored layout + every move comment, in order. Idempotent: each
// move carries an *absolute* target col, so re-applying the same comment converges (no drift).
// In log mode this is a no-op — the server folds moves into the board via `ElementMoved` and
// `/comments` returns feedback only — so the loop iterates nothing; it still drives the legacy
// `comments.jsonl` mode, where the board SVG is the authored layout and moves ride on top.
function replayMoves() {
  for (const id in baseCol) colOf[id] = baseCol[id];
  for (const c of comments) {
    if (c.kind !== "move" || colOf[c.elemId] === undefined) continue;
    colOf[c.elemId] = c.col;
    if (c.swapId !== undefined && colOf[c.swapId] !== undefined) colOf[c.swapId] = c.swapCol;
  }
  applyLayout();
}

// Nudge a sticky one column. Within its lane an occupied target column means the two swap.
function doMove(id, dir) {
  if (colOf[id] === undefined) return;
  const from = colOf[id], target = from + (dir === "left" ? -1 : 1);
  if (target < 0) { note("already at the left edge"); return; }
  let swapId = null;
  for (const oid in colOf) {
    if (oid !== id && kindOf[oid] === kindOf[id] && colOf[oid] === target) { swapId = oid; break; }
  }
  colOf[id] = target;
  if (swapId) colOf[swapId] = from;
  applyLayout();
  const c = { elemId: id, kind: "move", col: target, prevCol: from,
              text: `moved ${dir} to col ${target}`, ts: new Date().toISOString(), status: "open" };
  if (swapId) { c.swapId = swapId; c.swapCol = from; c.swapPrevCol = target; }
  note(swapId ? `swapped with ${swapId}` : `moved ${dir}`);
  postComment(c);
}

// Persist a comment (move or feedback): POST when live, else stash in localStorage. Offline
// stash is best-effort and one-way — it is NOT replayed to the server on reconnect (the next
// live `load()` replaces `comments` with the server's), so structural ops made offline (`add`,
// `move`) never reach the log. Export keeps them; the user is told so below.
async function postComment(c) {
  let posted = false;
  try {
    const r = await fetch("/comment", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(c) });
    posted = r.ok;
  } catch {}
  if (posted) { await load(); return; }
  const a = lsGet(); a.push(c); lsSet(a); comments = a; replayMoves(); paint();
  // add/drop can't reach the board offline (no server to mint/remove); move is applied locally.
  note((c.kind === "add" || c.kind === "drop")
    ? `offline — ${c.kind} saved locally (not applied to the board; Export to keep it)`
    : "offline — saved locally (Export to keep)");
}

// Reload: re-pull comments, and when the model changed under us, redraw the board with the
// changes-since-you-last-looked overlay (diffed against the version currently on screen).
async function load() {
  serverLive = false;
  try {
    const r = await fetch("/comments", { cache: "no-store" });
    if (r.ok) { comments = await r.json(); serverLive = true; }
  } catch {}
  if (!serverLive) { comments = lsGet(); replayMoves(); paint(); return; }
  const live = await liveVersion();
  if (live && shownVersion && live !== shownVersion) await showDiff(shownVersion, live);
  else if (shownVersion === null) shownVersion = live;  // baseline the initial server-rendered board
  replayMoves();
  paint();
}

// Replace the board with one diffed against `base`; advance the baseline to `live`.
async function showDiff(base, live) {
  try {
    const r = await fetch(boardSrc({ base }), { cache: "no-store" });
    if (!r.ok) return;
    $("#board").innerHTML = await r.text();
    bindStickies();
    if (r.headers.get("X-Diff-Base")) {
      diffing = true;
      diffBase = base;
      $("#plain").style.display = "";
      note("showing what changed since you last looked — Plain to clear");
    } else {
      note("model changed (baseline gone) — showing current");
    }
    shownVersion = live;
  } catch {}
}

// Clear the diff overlay: redraw the plain current board and re-baseline to it.
async function showPlain() {
  try {
    const r = await fetch(boardSrc(), { cache: "no-store" });
    if (r.ok) { $("#board").innerHTML = await r.text(); bindStickies(); replayMoves(); }
  } catch {}
  diffing = false;
  diffBase = null;
  $("#plain").style.display = "none";
  note("");
  shownVersion = await liveVersion();
}

let adj = {};          // id -> Set(neighbour id), built from the rendered edges
let edgesByNode = {};  // id -> [<path class="edge">], for hover highlighting
function buildGraph() {
  adj = {}; edgesByNode = {};
  document.querySelectorAll(".edge").forEach((p) => {
    const s = p.dataset.src, d = p.dataset.dst;
    (edgesByNode[s] ||= []).push(p); (edgesByNode[d] ||= []).push(p);
    (adj[s] ||= new Set()).add(d); (adj[d] ||= new Set()).add(s);
  });
}
function hoverOn(id) {
  $("#board").classList.add("dim");
  (edgesByNode[id] || []).forEach((p) => p.classList.add("hl"));
  document.getElementById(id)?.classList.add("adj");
  (adj[id] || []).forEach((n) => document.getElementById(n)?.classList.add("adj"));
}
function hoverOff() {
  $("#board").classList.remove("dim");
  document.querySelectorAll(".edge.hl").forEach((p) => p.classList.remove("hl"));
  document.querySelectorAll(".sticky.adj").forEach((g) => g.classList.remove("adj"));
}
function bindStickies() {
  buildGraph();
  readLayout();
  document.querySelectorAll(".sticky").forEach((g) => {
    g.onclick = () => openModal(g);
    g.onmouseenter = () => { hoverId = g.id; hoverOn(g.id); };
    g.onmouseleave = () => { if (hoverId === g.id) hoverId = null; hoverOff(); };
    // Keyboard parity with the mouse: focusing a sticky makes it the ← / → move target (same as
    // hover) and spotlights its connectors; Enter / Space opens its comment dialog.
    g.onfocus = () => { hoverId = g.id; hoverOn(g.id); };
    g.onblur = () => { if (hoverId === g.id) { hoverId = null; hoverOff(); } };
    g.onkeydown = (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openModal(g); }
    };
  });
}

function paint() {
  $("#status").textContent = serverLive ? "● live (server)" : "○ offline (localStorage)";
  $("#status").className = serverLive ? "live" : "";
  document.querySelectorAll(".sticky").forEach((g) => g.classList.remove("has-note"));
  // Structural ops (move/add/drop) aren't feedback on an existing box — keep them out of the note
  // badges, counts and prior-comment list. (Offline, a stashed `add`/`drop` lives only in
  // localStorage until export; there is no element to ring — or it's gone — see postComment.)
  const feedback = comments.filter((c) => !STRUCTURAL_KINDS.has(c.kind));
  const byEl = {};
  for (const c of feedback) if (c.elemId) (byEl[c.elemId] ||= []).push(c);
  for (const id in byEl) document.getElementById(id)?.classList.add("has-note");
  // A resolve comment quiets its hotspot right away (model `resolved:true` does it durably).
  for (const c of feedback) if (c.kind === "resolve") document.getElementById(c.elemId)?.classList.add("resolved");
  const open = feedback.filter((c) => c.status !== "resolved").length;
  $("#count").textContent = feedback.length ? `${feedback.length} comment(s), ${open} open` : "";
  window._byEl = byEl;
}

const PLACEHOLDERS = {
  add: "label for the new element — e.g. ItemDeleted",
};
// `add` mints a real element (it needs a lane + a label), so reveal the type select and
// retitle the save button; every other kind is a note on the element under the cursor.
function setKind() {
  const adding = $("#m-kind").value === "add";
  $("#m-type").style.display = adding ? "" : "none";
  $("#m-save").textContent = adding ? "Add element" : "Save comment";
  $("#m-text").placeholder = PLACEHOLDERS[$("#m-kind").value] || "short note — the next session reads this and adjusts the model";
}

const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
function openModal(g) {
  const id = g.id;
  $("#m-id").textContent = id;
  $("#m-label").textContent = g.dataset.hero || "";
  $("#m-detail").textContent = g.dataset.detail || "";
  // Relationships, the keyboard/non-hover way to read a box's connectors.
  const rel = [...(adj[id] || [])].map((n) => {
    const h = document.getElementById(n)?.dataset.hero || n;
    return `<span class="chip"><b>${esc(n)}</b> ${esc(h)}</span>`;
  }).join("");
  $("#m-rel").innerHTML = rel ? "connected to: " + rel : "";
  $("#m-text").value = "";
  $("#m-kind").value = "comment";
  $("#m-type").value = "event";
  setKind();
  const prior = (window._byEl?.[id] || []).map((c) => `<div>[${esc(c.kind)}] ${esc(c.text)}</div>`).join("");
  $("#m-prior").innerHTML = prior ? "<b>prior:</b>" + prior : "";
  $("#modal").returnValue = "cancel";
  $("#modal").showModal();
  window._activeId = id;
  window._activeCol = +g.dataset.col;   // a new element added "from this one" lands just after it
}

$("#m-kind").addEventListener("change", setKind);
syncPackUI();
bindStickies();
// The server first rendered CFG.pack; if a saved preference differs, switch to it before loading.
if (pack !== CFG.pack) renderPack();

$("#modal").addEventListener("close", () => {
  if ($("#modal").returnValue !== "save") return;
  const text = $("#m-text").value.trim();
  if (!text) return;
  const ts = new Date().toISOString();
  // `add` is a structural command: the server mints the id and folds it into the board, so it
  // carries a lane (`type`) and `col` instead of an `elemId`. Everything else annotates the box.
  if ($("#m-kind").value === "add") {
    // `??` only guards null/undefined, not NaN (a sticky with no numeric data-col), so test
    // finiteness explicitly — otherwise col would serialize to JSON null and misplace the element.
    const base = Number.isFinite(window._activeCol) ? window._activeCol : 0;
    postComment({ kind: "add", type: $("#m-type").value, text, col: base + 1, ts, status: "open" });
    return;
  }
  postComment({ elemId: window._activeId, kind: $("#m-kind").value, text, ts, status: "open" });
});

// Move buttons close the modal first so the nudge is visible (the backdrop dims the board).
$("#m-left").addEventListener("click", () => { const id = window._activeId; $("#modal").close("move"); doMove(id, "left"); });
$("#m-right").addEventListener("click", () => { const id = window._activeId; $("#modal").close("move"); doMove(id, "right"); });

// Hover a sticky and press ← / → to nudge it a column — the keyboard-fast path.
document.addEventListener("keydown", (e) => {
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  if ($("#modal").open || !hoverId) return;
  const ae = document.activeElement;
  if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
  e.preventDefault();
  doMove(hoverId, e.key === "ArrowLeft" ? "left" : "right");
});

// ---- packing control (rows / columns / grid) ------------------------------
function syncPackUI() {
  document.querySelectorAll("#pack button").forEach((b) =>
    b.setAttribute("aria-pressed", b.dataset.pack === pack ? "true" : "false"));
}
// Re-render at the current packing, keeping the diff overlay if one is showing (same baseline).
async function renderPack() {
  try {
    const r = await fetch(boardSrc(diffing && diffBase ? { base: diffBase } : {}), { cache: "no-store" });
    if (!r.ok) return;
    $("#board").innerHTML = await r.text();
    bindStickies();
    if (!diffing) replayMoves();
    paint();
  } catch {}
}
$("#pack").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-pack]");
  if (!b || b.dataset.pack === pack) return;
  pack = b.dataset.pack;
  localStorage.setItem("facetoPack", pack);
  syncPackUI();
  renderPack();
});

$("#refresh").addEventListener("click", load);
$("#plain").addEventListener("click", showPlain);
$("#export").addEventListener("click", async () => {
  const data = JSON.stringify(comments, null, 2);
  try { await navigator.clipboard.writeText(data); } catch {}
  const blob = new Blob([data], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "faceto-comments.json";
  a.click();
});

load();
</script>
</body>
</html>
